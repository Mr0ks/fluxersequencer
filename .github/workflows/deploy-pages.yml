name: Deploy Fluxline to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build static site
        shell: bash
        run: |
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPOSITORY_NAME" == *.github.io ]]; then
            export GITHUB_PAGES_BASE_PATH=""
          else
            export GITHUB_PAGES_BASE_PATH="/$REPOSITORY_NAME"
          fi
          export NEXT_PUBLIC_SITE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io${GITHUB_PAGES_BASE_PATH}"
          npm run build
      - name: Stage GitHub Pages artifact
        shell: bash
        run: |
          rm -rf pages-artifact
          mkdir -p pages-artifact
          cp -R dist/client/. pages-artifact/
          REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ -d "pages-artifact/$REPOSITORY_NAME/_next" ]]; then
            cp -R "pages-artifact/$REPOSITORY_NAME/_next" pages-artifact/_next
            rm -rf "pages-artifact/$REPOSITORY_NAME"
          fi
          touch pages-artifact/.nojekyll
          test -f pages-artifact/index.html
          test -d pages-artifact/_next
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
